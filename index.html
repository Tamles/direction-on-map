<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Application web directionnelle avec carte OpenStreetMap">
    <title>Direction sur Carte</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Message d'information -->
        <div id="info-banner" class="info-banner">
            <span>📍 Direction approximative</span>
        </div>

        <!-- Bouton de rafraîchissement -->
        <button id="refresh-button" class="refresh-button" aria-label="Rafraîchir la page" title="Rafraîchir la page">🔄</button>

        <!-- Bouton de recentrage -->
        <button id="recenter-button" class="recenter-button" aria-label="Centrer sur ma position" title="Centrer sur ma position">🎯</button>

        <!-- Carte -->
        <div id="map"></div>

        <!-- Affichage de la distance -->
        <div id="distance-container" class="distance-container hidden">
            <div id="distance" class="distance"></div>
        </div>

        <!-- Messages d'erreur/statut -->
        <div id="status" class="status hidden"></div>

        <!-- Panneau de configuration (optionnel) -->
        <div id="config-panel" class="config-panel">
            <button id="toggle-config" class="config-toggle" aria-label="Configuration">⚙️</button>
            <div id="config-content" class="config-content hidden">
                <!-- Section Ma position -->
                <div class="config-section">
                    <h3>📍 Ma position</h3>
                    <div class="position-mode">
                        <label class="radio-option">
                            <input type="radio" name="position-mode" value="gps" id="mode-gps" checked>
                            <span>🛰️ GPS automatique</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="position-mode" value="manual" id="mode-manual">
                            <span>📌 Position manuelle</span>
                        </label>
                    </div>

                    <!-- Contenu mode manuel -->
                    <div id="manual-position-content" class="manual-position-content hidden">
                        <button id="click-map-position" class="btn-map-click">📍 Cliquer sur la carte</button>
                        <p class="hint">ou saisissez les coordonnées :</p>
                        <div class="input-group">
                            <label for="user-lat">Latitude:</label>
                            <input type="number" id="user-lat" step="0.000001" placeholder="Ex: 48.858370">
                        </div>
                        <div class="input-group">
                            <label for="user-lng">Longitude:</label>
                            <input type="number" id="user-lng" step="0.000001" placeholder="Ex: 2.294481">
                        </div>
                        <button id="apply-manual-position" class="btn-primary">Appliquer la position</button>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Section Destinations sauvegardées -->
                <div class="config-section">
                    <h3>🎯 Destinations sauvegardées</h3>
                    <div id="saved-destinations-list" class="destinations-list">
                        <!-- Liste générée dynamiquement -->
                    </div>
                    <p class="hint empty-state" id="empty-destinations">Aucune destination sauvegardée</p>
                </div>

                <div class="divider"></div>

                <!-- Section Nouvelle destination -->
                <div class="config-section">
                    <h3>🗺️ Destination</h3>
                    <div class="input-group">
                        <label for="target-lat">Latitude:</label>
                        <input type="number" id="target-lat" step="0.000001" value="48.858370">
                    </div>
                    <div class="input-group">
                        <label for="target-lng">Longitude:</label>
                        <input type="number" id="target-lng" step="0.000001" value="2.294481">
                    </div>
                    <button id="update-target" class="btn-primary">Aller à cette destination</button>

                    <!-- Sauvegarde -->
                    <div class="save-section">
                        <div class="input-group">
                            <label for="destination-name">Nom (optionnel):</label>
                            <input type="text" id="destination-name" placeholder="Ex: Tour Eiffel, Bureau..." maxlength="50">
                        </div>
                        <button id="save-destination" class="btn-secondary">💾 Sauvegarder cette destination</button>
                        <button id="share-destination" class="btn-share">🔗 Partager cette destination</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="app.js"></script>
</body>
</html>
